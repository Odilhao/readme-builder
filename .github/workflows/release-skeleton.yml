name: Release

# This is a SKELETON workflow assembled from pieces built in issue #17 and #18.
#
# Issue #17 handles:
# 1. Version consistency gate: verify action.yml's embedded VERSION matches the tag
# 2. Rewrite action.yml's VERSION to the pushed tag
# 3. Move floating v1 tag to v1.x.y releases only
# 4. Version bumping job (bump-version) that opens the next dev cycle on main
#
# Issue #18 will add the build/push/attestation steps into the release job.

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Release and publish artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write      # For pushing version updates, tags, and creating releases
      packages: write      # For pushing image to ghcr.io
      id-token: write      # For generating OIDC token to sign attestations
      attestations: write  # For creating provenance and SBOM attestations
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Release jobs need to commit version updates back to the repo.
          persist-credentials: true

      # ========== ISSUE #17: Version rewrite and gate ==========

      - name: Sync version - rewrite action.yml and verify consistency
        run: |
          set -e

          # Check if action.yml exists (release precondition)
          if [[ ! -f action.yml ]]; then
            echo "ERROR: action.yml not found."
            echo "Release preconditions not met (issue #16 not yet merged)."
            exit 1
          fi

          tag="${GITHUB_REF_NAME}"

          # Read current version from action.yml
          # Structure: .runs.steps[0].env.VERSION
          # yq -e (exit-status) fails closed: exits non-zero when the path is
          # absent or resolves to null, instead of returning the literal
          # string "null" that a plain comparison would miss.
          if ! current_version=$(yq -e '.runs.steps[0].env.VERSION' action.yml 2>/dev/null); then
            echo "ERROR: action.yml exists but .runs.steps[0].env.VERSION not found."
            exit 1
          fi

          echo "Release tag: $tag"
          echo "Current action.yml VERSION: $current_version"

          # Rewrite the version in action.yml to match the tag
          yq -i ".runs.steps[0].env.VERSION = \"$tag\"" action.yml

          # Verify the rewrite succeeded
          new_version=$(yq '.runs.steps[0].env.VERSION' action.yml)
          if [[ "$new_version" != "$tag" ]]; then
            echo "ERROR: Version sync failed. Expected '$tag', got '$new_version'."
            exit 1
          fi

          # Commit the version update
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add action.yml
          git commit -m "chore(release): sync action.yml version to $tag"
          # Explicit refspec: a tag-push trigger leaves the checkout in
          # detached HEAD, so a bare "git push" has no branch to push and
          # fails with "You are not currently on a branch."
          git push origin HEAD:main

          echo "✓ action.yml synchronized to $tag"

      - name: Move floating v1 tag to this release
        run: |
          set -e
          tag="${GITHUB_REF_NAME}"

          # Only move v1 tag for v1.x.y releases (major version must be 1)
          # Reject: v2+, malformed tags, pre-release suffixes (-rc1, -alpha, etc.)
          if [[ ! "$tag" =~ ^v1\.[0-9]+\.[0-9]+$ ]]; then
            echo "Skipping v1 tag move: tag '$tag' is not a v1.x.y release"
            exit 0
          fi

          echo "Moving v1 tag to $tag"
          git tag -f v1 "$tag"
          git push origin v1 --force
          echo "✓ v1 tag moved to $tag"

      # ========== ISSUE #18: Build, push, and attest ==========

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Pin the toolchain
        run: echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"

      - name: Set up goreleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          install-only: true

      - name: Prefetch dependencies with hermeto
        run: bash .github/scripts/prefetch-deps.sh

      - name: Regenerate hermeto.env for bare runner paths
        # The prefetch script generates hermeto.env with host paths.
        # We need to keep it as-is since we're building on the bare runner.
        run: |
          set -euo pipefail
          # Verify hermeto cache was created
          [ -d hermeto-output ] || { echo "ERROR: hermeto-output directory not found"; exit 1; }
          [ -f hermeto.env ] || { echo "ERROR: hermeto.env not found"; exit 1; }
          echo "✓ Hermeto cache ready"

      - name: Derive SOURCE_DATE_EPOCH from tag commit
        run: |
          set -euo pipefail
          # Use the tag's commit date for reproducible builds.
          tag_commit=$(git rev-list -n 1 "$GITHUB_REF")
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct "$tag_commit")
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          echo "Release tag commit: $tag_commit"
          echo "Using SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"

      - name: Build release binaries with goreleaser
        env:
          GOFLAGS: -mod=readonly
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          source ./hermeto.env
          goreleaser release --clean --skip=validate,publish,announce
          echo "✓ Binaries and checksums built"
          ls -lh dist/

      - name: Create source tarball from tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          tarball="readme-builder-${tag}-source.tar.gz"
          mkdir -p dist
          git archive \
            --format=tar.gz \
            --prefix="readme-builder-${tag}/" \
            -o "dist/${tarball}" \
            "$tag"
          echo "✓ Source tarball created"
          ls -lh "dist/${tarball}"

      - name: Install QEMU for multi-arch builds
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-user-static

      - name: Regenerate hermeto.env for container mount paths
        # The hermeto.env was generated for the bare runner.
        # Container builds need /tmp/hermeto-output, so regenerate with that path.
        run: |
          set -euo pipefail
          podman run --rm \
            -v "$PWD:$PWD:z" \
            -w "$PWD" \
            "ghcr.io/hermetoproject/hermeto@sha256:bc33ceb313fc291736f546dc3bfad383d640cea8cb24e3f0d266686bdfa99d16" \
            generate-env \
            ./hermeto-output \
            -o ./hermeto.env.container \
            --for-output-dir /tmp/hermeto-output
          echo "✓ Container hermeto.env generated"

      - name: Build multi-arch image with buildah
        id: build
        uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056 # v2.13
        with:
          image: ghcr.io/odilhao/readme-builder
          tags: ${{ github.ref_name }}
          platforms: linux/amd64, linux/arm64
          containerfiles: ./Containerfile
          extra-args: |
            --volume ${{ github.workspace }}/hermeto-output:/tmp/hermeto-output:Z
            --volume ${{ github.workspace }}/hermeto.env.container:/tmp/hermeto.env:Z
            --network=none

      - name: Push image to ghcr.io
        id: push
        uses: redhat-actions/push-to-registry@5860fc963bf8f2b3221773a023141612f010c469 # v2
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest source tarball provenance
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-path: dist/readme-builder-${{ github.ref_name }}-source.tar.gz

      - name: Attest release binaries via checksums
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-checksums: dist/checksums.txt

      - name: Attest image provenance
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-digest: ${{ steps.push.outputs.digest }}
          subject-name: ${{ steps.build.outputs.image }}
          push-to-registry: true

      - name: Generate image SBOM and attest
        run: |
          set -euo pipefail

          # Install syft for SBOM generation if not present
          if ! command -v syft &> /dev/null; then
            echo "Installing syft..."
            curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          fi

          image="${{ steps.build.outputs.image }}"
          sbom_file="sbom-${{ github.ref_name }}.cyclonedx.json"

          echo "Generating CycloneDX SBOM for: $image"
          syft "$image" -o cyclonedx-json > "$sbom_file"
          echo "✓ SBOM generated: $sbom_file"

          # Move to dist for release asset collection
          mkdir -p dist
          mv "$sbom_file" "dist/$sbom_file"

      - name: Attest image SBOM
        uses: actions/attest-sbom@5026d3663739160db546203eeaffa6aa1c51a4d6 # v1
        with:
          sbom-path: dist/sbom-${{ github.ref_name }}.cyclonedx.json
          subject-digest: ${{ steps.push.outputs.digest }}
          subject-name: ${{ steps.build.outputs.image }}
          push-to-registry: true

      - name: Create GitHub release
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          # Create the release with generated changelog notes
          gh release create "$tag" \
            dist/readme-builder-${tag}-source.tar.gz \
            dist/checksums.txt \
            dist/sbom-${tag}.cyclonedx.json \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes

          echo "✓ GitHub release created: $tag"

  bump-version:
    name: Bump version for next development cycle
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # For pushing version bump commits to main
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Need full history to ensure push doesn't fail
          fetch-depth: 0
          persist-credentials: true

      - name: Bump VERSION file for next development cycle
        run: |
          set -e

          version_file="VERSION"

          if [[ ! -f "$version_file" ]]; then
            echo "ERROR: $version_file not found."
            exit 1
          fi

          # Read current version (format: X.Y.Z.dev0)
          current=$(cat "$version_file")
          echo "Current version: $current"

          # Validate shape before touching it. A manually-edited VERSION
          # (e.g. a leading-zero patch segment like 1.2.08.dev0) must fail
          # the job loudly here, not corrupt the arithmetic below and push
          # broken state to main with a contents:write token.
          if [[ ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.dev0$ ]]; then
            echo "ERROR: VERSION has unexpected format: $current (expected X.Y.Z.dev0)"
            exit 1
          fi

          # Strip .dev0 to get the release version
          release_version="${current%.dev0}"
          if [[ "$release_version" == "$current" ]]; then
            echo "ERROR: VERSION does not contain .dev0 suffix: $current"
            exit 1
          fi

          echo "Release version: $release_version"

          # Commit the release version (without .dev0)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "$release_version" > "$version_file"
          git add "$version_file"
          git commit -m "chore(release): release $release_version"

          # Parse version to bump patch: X.Y.Z -> X.Y.(Z+1)
          # Use parameter expansion and arithmetic to bump
          major_minor="${release_version%.*}"  # X.Y
          patch="${release_version##*.}"        # Z
          # Force base-10: bash arithmetic reads a leading-zero segment
          # (e.g. "08") as an invalid octal literal and errors out. The
          # format check above already guarantees only digits are here.
          next_patch=$((10#$patch + 1))
          next_version="$major_minor.$next_patch"

          echo "$next_version.dev0" > "$version_file"
          git add "$version_file"
          git commit -m "chore(release): open development cycle $next_version.dev0"

          echo "✓ Version bumped: $release_version -> $next_version.dev0"

          # Verify the commits only touched VERSION
          git log --oneline -2 main
          if [[ $(git diff HEAD~2 --stat | grep -vc "VERSION") -gt 1 ]]; then
            echo "ERROR: Unexpected file changes in version bump commits."
            git diff HEAD~2 --stat
            exit 1
          fi

          # Push both commits to main. Explicit refspec, safe under
          # detached HEAD regardless of how this ref was checked out.
          #
          # Note: this push is authored with the default GITHUB_TOKEN, so
          # it does not retrigger other workflows that listen on pushes to
          # main (e.g. ci.yml) - that's expected GitHub behaviour, not a
          # bug: actions run by GITHUB_TOKEN don't trigger further
          # workflow runs, to prevent accidental recursive triggering.
          git push origin HEAD:main
          echo "✓ Version bump commits pushed to main"
