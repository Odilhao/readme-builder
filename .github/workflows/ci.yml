name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # The race step overrides this; `go test -race` fails loudly with cgo off.
  CGO_ENABLED: "0"
  GOFLAGS: -mod=readonly
  # GOTOOLCHAIN is exported after setup-go rather than set here: setup-go skips
  # go.mod's `toolchain` directive when GOTOOLCHAIN is already local and
  # installs the older `go` directive version instead, silently.

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; leave no credential in .git/config.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Pin the toolchain
        run: echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"

      - name: Assert the toolchain matches go.mod
        run: |
          set -euo pipefail
          want="$(awk '/^toolchain go/ { print substr($2, 3); exit }' go.mod)"
          if [ -z "$want" ]; then
            echo "::error::go.mod has no toolchain directive; CI pins the toolchain from it"
            exit 1
          fi
          got="$(go env GOVERSION)"
          got="${got#go}"
          # Distribution builds append a suffix (go1.26.5-somevendor).
          case "$got" in
            "$want" | "$want"-*) ;;
            *)
              echo "::error::toolchain drift: go.mod asks for go${want}, this runner has go${got}"
              exit 1
              ;;
          esac
          echo "toolchain go${got} matches go.mod"

      - name: gofmt
        run: |
          set -euo pipefail
          # gofmt -l exits 0 while listing files, so its status is not a gate.
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-formatted:"
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        env:
          # The race detector is implemented in cgo.
          CGO_ENABLED: "1"
        run: go test ./... -race -count=1

      - name: Test with no token present
        # Invariant: no credential is ever required, only a higher rate limit.
        run: env -u GITHUB_TOKEN -u GH_TOKEN go test ./... -count=1

      - name: go.mod and go.sum are tidy
        run: |
          set -euo pipefail
          go mod tidy
          # git diff alone would miss a go.sum tidy has just created: a new
          # untracked file produces no diff.
          if ! git diff --quiet -- go.mod go.sum \
            || [ -n "$(git status --porcelain -- go.mod go.sum)" ]; then
            echo "::error::go.mod/go.sum are not tidy; run 'go mod tidy' and commit the result"
            git --no-pager diff -- go.mod go.sum
            git status --porcelain -- go.mod go.sum
            exit 1
          fi

      - name: Module cache matches go.sum
        run: go mod verify

      - name: Vendor directory does not exist
        run: test ! -e vendor

      - name: Prefetch dependencies with hermeto
        # Runs on all PRs and pushes to validate hermeto can prefetch from go.mod/go.sum.
        # Failure here is a gate condition: it means the prefetch would fail at release time.
        run: bash .github/scripts/prefetch-deps.sh

      - name: Check licences against whitelist
        # Hermeto outputs a CycloneDX SBOM alongside the cache. Parse it and reject
        # any licence outside the accepted set. This gate exists because vendoring
        # was removed: the vendor diff no longer provides automatic licence review.
        run: bash .github/scripts/check-licenses.sh

      - name: Hermetic build (offline Go build)
        # Validate that the hermeto prefetch captured the full transitive dependency graph
        # by building the binary offline using only the prefetched cache. This gate catches
        # prefetch gaps before the cache is uploaded as an artifact for use in build-image.
        # GOPROXY and GOMODCACHE are set via hermeto.env with runner-relative paths.
        env:
          GOFLAGS: -mod=readonly
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          source ./hermeto.env
          go build ./...

      - name: Regenerate hermeto.env for container mount path
        # The hermeto.env was generated with --for-output-dir "$PWD/hermeto-output" for the
        # runner's offline-build step above. But build-image mounts the cache at /tmp/hermeto-output
        # inside the container, so we need to regenerate hermeto.env with that path before uploading.
        # This ensures GOPROXY/GOMODCACHE in the container point to the correct mount location.
        run: |
          set -euo pipefail
          podman run --rm \
            -v "$PWD:$PWD:z" \
            -w "$PWD" \
            "ghcr.io/hermetoproject/hermeto@sha256:bc33ceb313fc291736f546dc3bfad383d640cea8cb24e3f0d266686bdfa99d16" \
            generate-env \
            ./hermeto-output \
            -o ./hermeto.env \
            --for-output-dir /tmp/hermeto-output

      - name: Upload hermeto cache for image build
        # Share the prefetched hermeto cache with build-image job via artifact.
        # Implements the design decision: "one prefetch per release, feeding both
        # the goreleaser binaries and the image" (per implementation.md M2 rationale).
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hermeto-cache
          path: |
            hermeto-output/
            hermeto.env
          retention-days: 1
          include-hidden-files: true

  build-binary-reproducibility:
    name: build binaries & verify reproducibility
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download hermeto cache from build-test
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hermeto-cache

      - name: Regenerate hermeto.env for bare runner (host paths)
        # The artifact contains hermeto.env with container paths (/tmp/hermeto-output).
        # This job runs on the bare runner with the cache at $PWD/hermeto-output.
        # Regenerate hermeto.env with host paths, reusing the prefetched cache data.
        run: |
          set -euo pipefail
          podman run --rm \
            -v "$PWD:$PWD:z" \
            -w "$PWD" \
            "ghcr.io/hermetoproject/hermeto@sha256:bc33ceb313fc291736f546dc3bfad383d640cea8cb24e3f0d266686bdfa99d16" \
            generate-env \
            ./hermeto-output \
            -o ./hermeto.env \
            --for-output-dir "$PWD/hermeto-output"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Pin the toolchain
        run: echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"

      - name: Set up goreleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          install-only: true

      - name: Validate goreleaser config
        run: goreleaser check

      - name: Derive SOURCE_DATE_EPOCH from commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build binaries (first run)
        env:
          GOFLAGS: -mod=readonly
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          source ./hermeto.env
          goreleaser build --snapshot --clean
          mkdir -p /tmp/build-run-1
          # Collect binaries with arch-qualified names to prevent overwrites
          while IFS= read -r binary_path; do
            # Extract architecture from path: dist/readme-builder_linux_ARCH_vX/readme-builder
            arch=$(echo "$binary_path" | grep -oP '_linux_\K[^_]+' || echo "unknown")
            cp "$binary_path" "/tmp/build-run-1/readme-builder-linux-${arch}"
          done < <(find dist -type f -path '*/readme-builder')
          # Verify exactly 2 binaries were collected (amd64 and arm64)
          [ "$(ls /tmp/build-run-1 | wc -l)" -eq 2 ] || {
            echo "::error::Expected 2 binaries in /tmp/build-run-1, found $(ls /tmp/build-run-1 | wc -l)"
            ls -la /tmp/build-run-1
            exit 1
          }

      - name: Build binaries (second run)
        env:
          GOFLAGS: -mod=readonly
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          source ./hermeto.env
          rm -rf dist
          goreleaser build --snapshot --clean
          mkdir -p /tmp/build-run-2
          # Collect binaries with arch-qualified names to prevent overwrites
          while IFS= read -r binary_path; do
            # Extract architecture from path: dist/readme-builder_linux_ARCH_vX/readme-builder
            arch=$(echo "$binary_path" | grep -oP '_linux_\K[^_]+' || echo "unknown")
            cp "$binary_path" "/tmp/build-run-2/readme-builder-linux-${arch}"
          done < <(find dist -type f -path '*/readme-builder')
          # Verify exactly 2 binaries were collected (amd64 and arm64)
          [ "$(ls /tmp/build-run-2 | wc -l)" -eq 2 ] || {
            echo "::error::Expected 2 binaries in /tmp/build-run-2, found $(ls /tmp/build-run-2 | wc -l)"
            ls -la /tmp/build-run-2
            exit 1
          }

      - name: Verify reproducibility (binary digests match)
        run: |
          set -euo pipefail

          # Verify both directories have exactly 2 files before comparing
          count1=$(ls /tmp/build-run-1 | wc -l)
          count2=$(ls /tmp/build-run-2 | wc -l)
          if [ "$count1" -ne 2 ] || [ "$count2" -ne 2 ]; then
            echo "::error::Binary count mismatch: build-run-1 has $count1 files, build-run-2 has $count2 files"
            exit 1
          fi

          echo "Build 1 SHA256 hashes:"
          (cd /tmp/build-run-1 && sha256sum *)
          echo ""
          echo "Build 2 SHA256 hashes:"
          (cd /tmp/build-run-2 && sha256sum *)
          echo ""

          # Independently verify each architecture
          fail=false
          for arch in amd64 arm64; do
            binary="readme-builder-linux-${arch}"
            if [ ! -f "/tmp/build-run-1/$binary" ] || [ ! -f "/tmp/build-run-2/$binary" ]; then
              echo "::error::Missing binary for $arch architecture"
              ls -la /tmp/build-run-1/ /tmp/build-run-2/
              fail=true
              continue
            fi

            hash1=$(sha256sum "/tmp/build-run-1/$binary" | awk '{print $1}')
            hash2=$(sha256sum "/tmp/build-run-2/$binary" | awk '{print $1}')

            if [ "$hash1" = "$hash2" ]; then
              echo "✓ $arch: reproducible (hash: ${hash1:0:16}...)"
            else
              echo "::error::$arch: reproducibility FAILED"
              echo "  Build 1: $hash1"
              echo "  Build 2: $hash2"
              fail=true
            fi
          done

          if [ "$fail" = true ]; then
            echo "::error::One or more architectures failed reproducibility check"
            exit 1
          fi

          echo ""
          echo "Reproducibility check passed: both builds produced identical binaries for all architectures"

  build-image:
    name: build & validate OCI image
    needs: build-test
    env:
      IMAGE_NAME: ghcr.io/odilhao/readme-builder
      IMAGE_TAG: latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download hermeto cache from build-test
        # Reuse the hermeto prefetch from build-test job via artifact.
        # Implements: one prefetch per release, feeding both builds (goreleaser and container image).
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hermeto-cache

      - name: Install QEMU for cross-architecture builds
        # Multi-platform RUN instructions (e.g., go build in Containerfile) require qemu-user-static
        # for cross-architecture emulation. Stock ubuntu-latest does not include this by default.
        # Pattern from redhat-actions/buildah-build's official multiarch.yml example workflow.
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Build multi-arch image with buildah
        # Build linux/amd64 and linux/arm64 variants using buildah.
        # Hermeto-prefetched dependencies are mounted as volumes into the build.
        # The Containerfile sources /tmp/hermeto.env to enable offline builds.
        uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056 # v2.13
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ env.IMAGE_TAG }}
          platforms: linux/amd64, linux/arm64
          containerfiles: |
            ./Containerfile
          # Pass hermeto cache and environment into the build via volume mounts.
          # These are mounted read-only (Z suffix for SELinux relabeling in container context).
          extra-args: |
            --volume ${{ github.workspace }}/hermeto-output:/tmp/hermeto-output:Z
            --volume ${{ github.workspace }}/hermeto.env:/tmp/hermeto.env:Z
            --network=none
